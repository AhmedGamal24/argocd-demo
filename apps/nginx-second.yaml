apiVersion: argoproj.io/v1alpha1
kind: Application 
metadata:
  name: nginx-second
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AhmedGamal24/argocd-demo.git
    targetRevision: main
    path: plain-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-second

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
